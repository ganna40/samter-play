name: Public Demo CI

on:
  push:
    branches: [new, phase15-public-demo]
  pull_request:
    branches: [new]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run public demo tests
        run: node --test tests/*.test.mjs phase13_demo.test.mjs
      - name: Check JavaScript syntax
        run: for file in *.js; do node --check "$file"; done
